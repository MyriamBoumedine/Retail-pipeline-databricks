# databricks.yml
# Définit en code le job "retail_project_pipeline" (bronze -> silver -> gold)
# Documentation : https://docs.databricks.com/dev-tools/bundles/index.html

bundle:
  name: retail-pipeline-databricks

# ---------------------------------------------------------------------------
# Ressources : le job orchestré (équivalent code de ce qui a été créé
# manuellement dans Jobs & Pipelines)
# ---------------------------------------------------------------------------
resources:
  jobs:
    retail_project_pipeline:
      name: retail_project_pipeline

      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/02_bronze.py

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/03_silver.py

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../notebooks/04_gold.py

      # Pas de bloc "job_clusters" : on utilise le compute serverless,
      # cohérent avec Databricks Free Edition (pas de cluster classique).

# ---------------------------------------------------------------------------
# Environnements cibles (dev pour l'instant ; prod à ajouter plus tard)
# ---------------------------------------------------------------------------
targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-73e9c70d-79d4.cloud.databricks.com
